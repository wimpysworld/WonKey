version: 2

before:
  hooks:
    - >-
      sh -c 'test -n "$GITHUB_REPOSITORY" && test -n "$GITHUB_REPOSITORY_OWNER" ||
      { echo "set GITHUB_REPOSITORY=owner/repository and GITHUB_REPOSITORY_OWNER=owner before running GoReleaser" >&2; exit 1; }'

builds:
  - id: "wonkey"
    main: "./cmd/wonkey"
    binary: "wonkey"
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: [-s -w]

archives:
  - id: compressed
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: packages
    ids: ["wonkey"]
    package_name: '{{ $name := replace (tolower .ProjectName) "_" "-" }}{{ if or (not (filter $name "^[a-z0-9]")) (lt (len $name) 2) }}pkg-{{ end }}{{ $name }}'
    formats: [deb, rpm, apk]
    maintainer: '{{ .Env.GITHUB_REPOSITORY_OWNER }}'
    homepage: 'https://github.com/{{ .Env.GITHUB_REPOSITORY }}'
    bindir: /usr/bin

aurs:
  - ids:
      - compressed
    name: wonkey-bin
    provides: [wonkey]
    conflicts: [wonkey]
    description: "Configure your XFKEY One Key Max on Linux."
    homepage: https://github.com/wimpysworld/WonKey
    maintainers:
      - "Martin Wimpress <code@wimpress.io>"
    license: BlueOak-1.0.0
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/wonkey-bin.git"
    package: |
      install -Dm755 wonkey "${pkgdir}/usr/bin/wonkey"

nix:
  - name: wonkey
    repository:
      owner: wimpysworld
      name: nix-packages
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    path: pkgs/wonkey/default.nix
    description: "Configure your XFKEY One Key Max on Linux."
    homepage: https://github.com/wimpysworld/WonKey
    license: blueOak100

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc

release:
  prerelease: auto
